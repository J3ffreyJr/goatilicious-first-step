spring.application.name=goatilicious-backend

# RNF01: base H2 em ficheiro (os dados sobrevivem a reinícios). A pasta data/ não vai para o Git.
spring.datasource.url=jdbc:h2:file:./data/goatilicious;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Console do H2 desligado por defeito; para ligar localmente:
# SPRING_H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
goatilicious.cors.allowed-origins=${GOATILICIOUS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SERVER_SESSION_COOKIE_SECURE:false}

# E-mail das faturas. O servidor SMTP vem de variáveis de ambiente (nunca do código):
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
# Sem SPRING_MAIL_HOST o envio responde 503 "E-mail não configurado".
goatilicious.mail.from=${GOATILICIOUS_MAIL_FROM:no-reply@goatilicious.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Primeiro staff (separação Cliente/Staff). Definir por variáveis de ambiente; nada de senhas no código:
# GOATILICIOUS_STAFF_EMAIL, GOATILICIOUS_STAFF_PASSWORD, GOATILICIOUS_STAFF_NAME (opcional).
# Sem as duas primeiras, nenhum staff é criado e o painel fica inacessível.
goatilicious.staff.email=${GOATILICIOUS_STAFF_EMAIL:}
goatilicious.staff.password=${GOATILICIOUS_STAFF_PASSWORD:}
goatilicious.staff.name=${GOATILICIOUS_STAFF_NAME:Staff}
