spring.application.name=goatilicious-backend

# RNF01: base H2 em ficheiro (os dados sobrevivem a reinícios). A pasta data/ não vai para o Git.
spring.datasource.url=jdbc:h2:file:./data/goatilicious;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Console do H2 desligado por defeito; para ligar: SPRING_H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=false

# E-mail das faturas. O servidor SMTP vem de variáveis de ambiente (nunca do código):
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD.
# Sem SPRING_MAIL_HOST o envio responde 503 "E-mail não configurado".
goatilicious.mail.from=${GOATILICIOUS_MAIL_FROM:no-reply@goatilicious.local}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
