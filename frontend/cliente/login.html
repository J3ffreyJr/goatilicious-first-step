<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entrar | Goatilicious</title>
  <meta name="description" content="Entre na sua conta Goatilicious para encomendar e acompanhar os seus pedidos.">
  <meta name="theme-color" content="#1c0e07">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Fonte Galada pré-carregada -->
  <link rel="preload" href="/node_modules/@fontsource/galada/files/galada-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

  <script type="module" src="./login.js"></script>
</head>
<body class="cadastro-page">
  <div id="bubbles-container" aria-hidden="true"></div>

  <!-- Cabeçalho oficial com navegação e logotipo em Galada -->
  <header class="header">
    <a href="/" class="logo" aria-label="Goatilicious Página Inicial">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
        <path d="M8 14C9.5 16 14.5 16 16 14M9 9H9.01M15 9H15.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>Goatilicious</span>
    </a>
    <nav class="nav glass" id="site-nav" aria-label="Navegação Principal">
      <a href="/" class="nav-item">Início</a>
      <a href="/#sabores" class="nav-item">Sabores</a>
      <a href="/#origem" class="nav-item">O Nosso Leite</a>
      <a href="/cliente/pedido.html" class="nav-item">Encomendas</a>
    </nav>
    <div class="header-actions">
      <a href="/" class="contact-btn" style="text-decoration: none; display: inline-flex; align-items: center;">Voltar ao Início</a>
      <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Cartão Central Glassmorphism -->
  <main class="cadastro-container">
    <section class="glass-card">
      <div class="card-header">
        <span class="form-badge">A sua conta</span>
        <h1 class="form-title">Entrar</h1>
        <p class="form-subtitle">Entre para fazer pedidos e acompanhar as suas encomendas e faturas.</p>
      </div>

      <form id="form-login" class="form-grid" novalidate>
        <label class="input-label" for="email">
          <span>Email *</span>
          <input type="email" id="email" name="email" class="input-field" placeholder="nome@exemplo.com" required autocomplete="username">
        </label>
        <label class="input-label" for="senha">
          <span>Palavra-passe *</span>
          <input type="password" id="senha" name="senha" class="input-field" required autocomplete="current-password">
        </label>
        <button type="submit" id="btn-entrar" class="btn-submit"><span>Entrar</span></button>
      </form>

      <div id="mensagem" class="mensagem-box" role="alert" hidden></div>

      <div class="card-footer-info">
        <p>Ainda não tem conta? <a href="/cliente/cadastro.html">Criar conta &rarr;</a></p>
      </div>
    </section>
  </main>
</body>
</html>
