<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturas | Painel Goatilicious</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <header class="topo">
    <h1>Goatilicious</h1>
    <p>Painel interno</p>
  </header>
  <nav class="menu-staff" aria-label="Navegação do painel">
    <a href="index.html">Início</a>
    <a href="clientes.html">Clientes</a>
    <a href="gerir-pedidos.html">Pedidos</a>
    <a href="facturas.html" class="ativo">Facturas</a>
  </nav>

  <main class="largo">
    <section class="cartao">
      <h2>Facturas</h2>
      <p class="contagem">Cada pedido gera uma fatura rascunho. Depois de revisto em <a href="gerir-pedidos.html">Pedidos</a>, a fatura passa a final.</p>
      <div class="barra">
        <span id="contagem" class="contagem"></span>
        <button type="button" id="btn-atualizar">Atualizar</button>
      </div>
      <div class="tabela-wrap">
        <table id="tabela-facturas">
          <thead>
            <tr><th>Factura</th><th>Pedido</th><th>Cliente</th><th>Total</th><th>Pagamento</th><th>Estado</th><th>Data</th></tr>
          </thead>
          <tbody id="corpo-tabela"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../shared/config.js"></script>
  <script src="facturas.js"></script>
</body>
</html>
